name: Build

# Every pull request and every push to main: the unit tests and a test APK (signed with the
# runner's debug key; the APK people install comes from release.yml). The APK is kept as a run
# artifact for 14 days. The tests that need sample videos skip themselves here (no samples in CI).
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # versionCode = minutes since 2026-01-01, the same clock as tools/install.ps1 and release.yml.
      - name: Version
        run: echo "BUILD_NUMBER=$(( ($(date -u +%s) - 1767225600) / 60 ))" >> "$GITHUB_ENV"

      - name: Unit tests and APK
        working-directory: android
        run: |
          set -o pipefail
          status=0
          ./gradlew testDebugUnitTest assembleDebug --console=plain 2>&1 | tee build.log || status=$?
          if [ $status -ne 0 ]; then
            grep -E "^e: |error:|What went wrong|FAILED|Exception|expected:<" build.log | head -40 | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
          fi
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: insvMagik-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
