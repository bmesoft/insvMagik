name: Release

# Makes the APK people download. A release is a tag release/<YYYY-MM-DD>.<n> (n = 1, 2, … within
# the day, Prague date) on main:
#  - run this workflow by hand from main (Actions → Release → Run workflow): it picks the next name
#    and makes the tag, or
#  - push such a tag yourself.
# It runs the unit tests, builds the release APK signed with the release key, and publishes it as
# the latest GitHub release, so this link always gives the newest version:
#   https://github.com/bmesoft/insvMagik/releases/latest/download/insvMagik.apk
# Needs the repo secrets SIGNING_KEYSTORE_BASE64 (base64 of the .jks, key alias "insvmagik") and
# SIGNING_PASSWORD. Every release must be signed with the same key, or phones refuse the update.
on:
  push:
    tags: [ 'release/*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags and history for the release notes

      - name: Release name
        id: name
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Releases are made from main only (this run is on $GITHUB_REF)."; exit 1
            fi
            day=$(TZ=Europe/Prague date +%F)
            n=1
            while git rev-parse -q --verify "refs/tags/release/$day.$n" >/dev/null; do n=$((n + 1)); done
            tag="release/$day.$n"
          fi
          name="${tag#release/}"
          if ! [[ "$name" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$ ]]; then
            echo "::error::Release tags look like release/2026-11-18.1, not $tag."; exit 1
          fi
          prev=$(git tag -l 'release/*' --sort=-creatordate | grep -vx "$tag" | head -1 || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::The repo secrets SIGNING_KEYSTORE_BASE64 and SIGNING_PASSWORD are not set: no signed release."; exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and release APK
        working-directory: android
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          VERSION_NAME: ${{ steps.name.outputs.name }}
        run: |
          export BUILD_NUMBER=$(( ($(date -u +%s) - 1767225600) / 60 ))
          set -o pipefail
          status=0
          ./gradlew testDebugUnitTest assembleRelease --console=plain 2>&1 | tee build.log || status=$?
          rm -f "$SIGNING_KEYSTORE_FILE"
          if [ $status -ne 0 ]; then
            grep -E "^e: |error:|What went wrong|FAILED|Exception|expected:<" build.log | head -40 | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
            exit $status
          fi
          cp app/build/outputs/apk/release/app-release.apk ../insvMagik.apk

      # The tag is made only once the build has passed, so a failed run leaves nothing behind.
      - name: Tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "${{ steps.name.outputs.tag }}" "$GITHUB_SHA"
          git push origin "${{ steps.name.outputs.tag }}"

      # Release notes: the merged pull requests since the previous release.
      - name: Release notes
        env:
          TAG: ${{ steps.name.outputs.tag }}
          PREV: ${{ steps.name.outputs.prev }}
          NAME: ${{ steps.name.outputs.name }}
        run: |
          range="$TAG"
          [ -n "$PREV" ] && range="$PREV..$TAG"
          {
            echo "insvMagik $NAME for Android 10 and newer. Install: download **insvMagik.apk** below on the phone and open it; see the [tester guide](https://github.com/${{ github.repository }}/blob/main/docs/tester-guide.md)."
            echo
            echo "## Changes"
            git log --first-parent --format='%H%x09%s' "$range" | while IFS=$'\t' read -r sha subject; do
              if [[ "$subject" =~ ^Merge\ pull\ request\ \#([0-9]+) ]]; then
                title=$(git log -1 --format=%b "$sha" | sed '/^$/d' | head -1)
                echo "- ${title:-$subject} (#${BASH_REMATCH[1]})"
              elif [[ "$subject" != Merge\ branch* ]]; then
                echo "- $subject"
              fi
            done | head -50
          } > notes.md
          cat notes.md

      - name: Publish as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.name.outputs.tag }}" insvMagik.apk \
            --title "insvMagik ${{ steps.name.outputs.name }}" \
            --notes-file notes.md --verify-tag --latest
